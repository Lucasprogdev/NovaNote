# NovaNote — Spécification de projet XcodeGen
#
# Ce fichier est la source de vérité du projet Xcode.
# Le fichier `NovaNote.xcodeproj` est généré automatiquement et n'est pas versionné.
#
#   Générer :  xcodegen generate
#   (sur macOS, ou dans la CI GitHub Actions)
#
# Cible : iOS 27+ (langage visuel Liquid Glass). La cible de déploiement peut
# être surchargée au build :
#   xcodebuild ... IPHONEOS_DEPLOYMENT_TARGET=26.0

name: NovaNote

options:
  bundleIdPrefix: com.novanote
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
  minimumXcodeGenVersion: "2.38.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""

targets:
  NovaNote:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: NovaNoteApp.swift
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Extensions
      - path: Utilities
      - path: Intents
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: NovaNote
        PRODUCT_BUNDLE_IDENTIFIER: com.novanote.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

schemes:
  NovaNote:
    build:
      targets:
        NovaNote: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
